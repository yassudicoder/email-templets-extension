<!doctype html>
<!-- Source for og/cover.png — render at exactly 1200×630 and screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canned Responses — OG cover source</title>
<style>
  @font-face{font-family:"Fraunces";font-weight:100 900;src:url("../fonts/fraunces.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:100 900;src:url("../fonts/inter.woff2") format("woff2")}
  @font-face{font-family:"JetBrains Mono";font-weight:400;src:url("../fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2")}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    position:relative;background:#faf9f5;color:#14161c;
    font-family:"Inter",system-ui,sans-serif;
    padding:56px 72px;
  }
  .rules{position:absolute;inset:0;opacity:.55;
    background-image:repeating-linear-gradient(180deg,transparent 0 31px,#e6e3d8 31px 32px)}
  .mono{font-family:"JetBrains Mono",monospace}
  .brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:26px;letter-spacing:-.01em}
  .kick{position:absolute;top:64px;right:72px;text-align:right;color:#979dab;font-size:14px;letter-spacing:.2em}
  h1{font-family:"Fraunces",serif;font-weight:800;font-variation-settings:"opsz" 100;
     font-size:104px;line-height:.99;letter-spacing:-.015em;margin-top:46px}
  .row{position:absolute;left:72px;right:72px;bottom:56px;display:flex;align-items:center;justify-content:space-between}
  .keys{display:flex;align-items:center;gap:12px}
  .keycap{display:inline-flex;align-items:center;justify-content:center;
    font-family:"JetBrains Mono",monospace;font-weight:600;letter-spacing:.08em;
    background:linear-gradient(180deg,#ffffff,#f4f2ec);border:1.5px solid #b9b4a2;border-bottom-width:7px;border-radius:14px;
    padding:18px 30px;font-size:26px}
  .plus{font-family:"JetBrains Mono",monospace;font-size:24px;color:#979dab}
  .stat{display:flex;align-items:baseline;gap:16px;font-family:"JetBrains Mono",monospace}
  .stat s{color:#c93a28;font-size:26px}
  .stat b{color:#2563eb;font-size:40px;font-weight:600}
  .stat i{font-style:normal;color:#979dab;font-size:14px;letter-spacing:.18em}
  .free{position:absolute;left:72px;top:64px;display:none}
</style>
</head>
<body>
  <div class="rules"></div>
  <div class="brand">
    <svg width="42" height="42" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#2563eb"/><path d="M19 14a1.6 1.6 0 0 1-1.6 1.6H8l-3 3V6.6A1.6 1.6 0 0 1 6.6 5h10.8A1.6 1.6 0 0 1 19 6.6z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 10.2h5M9.5 12.2h3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
    Canned Responses
  </div>
  <p class="kick mono">EMAIL TEMPLATES FOR<br>GMAIL + LINKEDIN<br>FREE · LOCAL-FIRST</p>
  <h1>YOU ALREADY<br>WROTE THIS<br>EMAIL.</h1>
  <div class="row">
    <div class="keys">
      <span class="keycap">ALT</span><span class="plus">+</span><span class="keycap">A</span>
    </div>
    <div class="stat"><i>KEYSTROKES</i><s>187</s><b>→ 3</b></div>
  </div>
</body>
</html>
